<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/style.css">
    <title>jacob companhia</title>
</head>

<body>
    <div class="capa-img">
    </div>
    <!-- Cabecalho do site -->
    <div class="cont-site">
        <header id="site-cabeca" class="is--nav">
            <nav class="site-nav">

                <ul>
                    <li><a href="#">Shop</a></li>
                    <li><a href="#">Artigo</a></li>
                    <li><a href="#">Contato</a></li>
                </ul>

                <div class="site-titulo" id="titulo">
                    <h1>JacobCompanhia</h1>
                </div>

                <div class="copy-right">
                    <p>&copy; 2024 all rights reserved</p>
                </div>
            </nav>
        </header>

        <!-- Sessao main -->
        <main id="site-main">

            <!-- sessao descoberta -->
            <section class="descoberta" id="descoberta">

                <div class="conteiner">

                    <div class="slide">
                        <h1 class="slideText1">Descobrir</h1>
                    </div>
                    <div class="slide">
                        <h1 class="slideText2 slide-light">Tendencias</h1>
                    </div>
                    <div class="slide">
                        <h1 class="slideText3">minimo</h1>
                    </div>
                    <div class="slide">
                        <h1 class="slideText4">Esforco</h1>
                    </div>
                </div>
            </section>

            <section class="sessao-img" id="sessao-img">
                <div class="conteiner"> 
                    <div class="cover">
                        <img src="img/sessao-imagem.jpg" alt="imgem de ternosa na vitrine" id="ternos-img">
                    </div>
                </div>
            </section>
            <section class="rolagem">
                <div class="conteudo-rolagem">
                    <div class="conteudo"></div>
                </div>
            </section>
        </main>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
<script src="script/script.js" defer></script>
</html>
