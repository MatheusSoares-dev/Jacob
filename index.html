<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/style.css">
    <title>jacob Companhia</title>
</head>

<body>
    <div class="capa-img">
    </div>
    <!-- Cabecalho do site -->
    <div class="cont-site">
        <header id="site-cabeca" class="is--nav">
            <nav class="site-nav">

                <ul>
                    <li><a href="#">Shop</a></li>
                    <li><a href="#">Artigo</a></li>
                    <li><a href="#">Contato</a></li>
                </ul>

                <div class="site-titulo" id="titulo">
                    <h1>JacobCompanhia</h1>
                </div>

                <div class="copy-right">
                    <p>&copy; 2024 all rights reserved</p>
                </div>
            </nav>
        </header>

        <!-- Sessao main -->
        <main id="site-main">

            <!-- sessao descoberta -->
            <section class="descoberta" id="descoberta">

                <div class="conteiner">

                    <div class="slide">
                        <h1 class="slideText1">Descobrir</h1>
                    </div>
                    <div class="slide">
                        <h1 class="slideText2 slide-light">Tendencias</h1>
                    </div>
                    <div class="slide">
                        <h1 class="slideText3">minimo</h1>
                    </div>
                    <div class="slide">
                        <h1 class="slideText4">Esforco</h1>
                    </div>
                </div>
            </section>

            <section class="sessao-img" id="sessao-img">
                <div class="conteiner">
                    <div class="cover">
                        <img src="img/sessao-imagem.jpg" alt="imgem de ternosa na vitrine" id="ternos-img">
                    </div>
                </div>
            </section>

            <!-- Scroll hORIZONTAL -->

            <section class="rolagem">
                <div class="conteudo-rolagem">
                    <div class="conteudo">

                        <div class="largura">
                            <div class="traje-card">
                                <div class="conteiner-img">
                                    <img src="img/imagem terno1.jpg" alt="">
                                </div>
                                
                            </div>
                        </div>

                        <div class="largura">
                            <div class="traje-card">
                                <div class="conteiner-img">
                                    <img src="img/imagem terno2.jpg" alt="">
                                </div>
                            </div>
                        </div>

                        <div class="largura">
                            <div class="traje-card">
                                <div class="conteiner-img">
                                    <img src="img/imagem terno3.jpg" alt="">
                                </div>
                            </div>
                        </div>

                        <div class="largura">
                            <div class="traje-card">
                                <div class="conteiner-img">
                                    <img src="img/imagem terno4.jpg" alt="">
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </section>

            <section class="servicos-sessao" id="servicos-sessao">
                <div class="conteiner">
                    <div class="servicos-titulo">
                        <h2>Criação</h2>
                    </div>

                    <div class="grid-img">
                        <div class="grid-itens">
                            <div class="box">
                                <img src="img/criacao1.jpg" alt="Imagem de criacao de terno1">
                            </div>
                            <div class="box">
                                <img src="img/criacao2.jpg" alt="Imagem de criacao de terno2">
                            </div>
                            <div class="box">
                                <img src="img/criacao3.jpg" alt="Imagem de criacao de terno3">
                            </div>
                            <div class="box">
                                <img src="img/criacao4.jpg" alt="Imagem de criacao de terno4">
                            </div>
                        </div>
                    </div>

                    <div class="grid-img">
                        <div class="grid-itens">
                            <div class="box">
                                <img src="img/broche1.jpg" alt="Imagem de criacao de broche1">
                            </div>
                            <div class="box">
                                <img src="img/broche2.jpg" alt="Imagem de criacao de broche2">
                            </div>
                            <div class="box">
                                <img src="img/broche3.jpg" alt="Imagem de criacao de broche3">
                            </div>
                            <div class="box">
                                <img src="img/broche4.jpg" alt="Imagem de criacao de broche4">
                            </div>
                        </div>
                    </div>

                    <div class="grid-img">
                        <div class="grid-itens">
                            <div class="box">
                                <img src="img/gravata1.jpg" alt="Imagem de criacao de gravata1">
                            </div>
                            <div class="box">
                                <img src="img/gravata2.jpg" alt="Imagem de criacao de gravata2">
                            </div>
                            <div class="box">
                                <img src="img/gravata3.jpg" alt="Imagem de criacao de gravata3">
                            </div>
                            <div class="box">
                                <img src="img/gravata4.jpg" alt="Imagem de criacao de gravata4">
                            </div>
                        </div>
                    </div>

                    <div class="grid-img">
                        <div class="grid-itens">
                            <div class="box">
                                <img src="img/abotoadura1.jpg" alt="Imagem de criacao de abotoadura1">
                            </div>
                            <div class="box">
                                <img src="img/abotoadura2.jpg" alt="Imagem de criacao de abotoadura2">
                            </div>
                            <div class="box">
                                <img src="img/abotoadura3.jpg" alt="Imagem de criacao de abotoadura3">
                            </div>
                            <div class="box">
                                <img src="img/abotoadura4.jpg" alt="Imagem de criacao de abotoadura">
                            </div>
                        </div>
                    </div>
                </div>
                
            </section> 

        </main>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
<script src="script/script.js" defer></script>

</html>
